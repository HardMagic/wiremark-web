name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Hourly certificate and HTTPS check (wiremark/ops#23): the https job heals a
  # missing or failed Pages certificate, and the TLS check makes a wrong or
  # expiring certificate a red run. Scheduled runs do not redeploy.
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# A scheduled check must never cancel a deploy, so it has its own group.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'pages-https' || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      # Publish only the allow-listed site files, never the repository root
      # (wiremark/ops#21), and refuse to publish what the public-surface gate
      # rejects. The same checks run in GitLab CI before merge.
      - name: Build site
        run: sh scripts/build-site.sh _site
      - name: Public-surface gate
        run: node scripts/check-public-surface.mjs _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Keep the custom-domain certificate issued and HTTPS enforced, then prove
  # what the public sees: apex and www must serve a trusted certificate that
  # covers the host and is valid for at least 14 more days (wiremark/ops#23).
  # Runs after a deploy, and alone on the schedule.
  https:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Heal Pages certificate and enforce HTTPS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/pages-https.sh "${{ github.repository }}"
      - name: TLS check (apex and www)
        run: node scripts/check-tls.mjs --min-days 14
