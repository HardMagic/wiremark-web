# Static marketing site (no build step: the repo root is what is served).
# Production deploy is .github/workflows/pages.yml (GitHub Pages, wiremark.net),
# so gh-pages is mirrored outside this pipeline (GITHUB_MIRROR_EXTERNAL).
#
# Before this file existed GitLab fell back to Auto DevOps, which tried to build
# a Heroku buildpack image and run tests on a static site, leaving the default
# branch pipeline red since 2026-08-05.
include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/pipelines/static-site.yml'

variables:
  GITHUB_REPO: "HardMagic/wiremark-web"
  GITHUB_MIRROR_EXTERNAL: "true"
  # Publish only the allow-listed site files (scripts/build-site.sh), never the
  # repository root: the same set GitHub Pages serves and the gate checks.
  SITE_DIR: "_site"
  BUILD_COMMANDS: "sh scripts/build-site.sh _site"

# Public-surface gate (wiremark/ops#21): wiremark.net is the only public
# Wiremark surface and shows features only; every app stays on Ziti. Fails on a
# password field or form, an internal hostname, a price, an app.wiremark.net
# link without the private-network note, any other *.wiremark.net name, or a
# Cloudflare /cdn-cgi/ rewrite (wiremark/ops#20; the live run of the same rules
# is in .github/workflows/pages.yml).
# The self-test proves each rule still trips on its fixture in
# tests/public-surface/. It has no rules, so it runs in every pipeline,
# Draft MRs included.
public-surface:
  stage: preflight
  needs: []
  interruptible: true
  # renovate: datasource=docker depName=node
  image: harbor.focuscell.org/dockerhub-proxy/library/node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
  script:
    - node scripts/check-public-surface.mjs --self-test
    # Offline rules of the live TLS check (wiremark/ops#23); the live check
    # itself runs hourly in .github/workflows/pages.yml, which reaches the
    # public internet.
    - node scripts/check-tls.mjs --self-test
    - sh scripts/build-site.sh _site
    - node scripts/check-public-surface.mjs _site

# Hero idle check (wiremark/site#5, #6): the .image-distortion WebGL hover
# effect draws on demand and leaves the main thread idle, and the page's own
# animation (assets/js/idle-motion.js) asks for no frame loop at rest and runs
# only on screen, never under reduced motion; nothing is paused for the check. On index-2 and index-3, in
# headless Chromium with software WebGL (the GPU the wiremark/qa Lighthouse and
# Lost Pixel jobs get): no long task and no frame drawn once every effect has
# drawn, the rAF loop restarts on pointer movement and stops when the flow has
# settled, and reduced motion or a missing WebGL leave the plain background.
# The image's browsers match the playwright version in package-lock.json, so
# both move together. Resources as wiremark/qa's Chromium jobs.
hero-idle:
  stage: preflight
  needs: []
  interruptible: true
  # renovate: datasource=docker depName=mcr.microsoft.com/playwright
  image: harbor.focuscell.org/mcr-proxy/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  script:
    - npm ci --no-audit --no-fund
    - sh scripts/build-site.sh _site
    - node scripts/check-hero-idle.mjs _site --report .hero-idle/report.json
  artifacts:
    when: always
    expire_in: 14 days
    paths: [.hero-idle/]
